<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Chat</title>
    <!--
      Splash window (420x300, frameless). Shown by src/main/index.ts before
      controller.init() and destroyed once the main window is ready. Deliberately
      self-contained: no script, no preload, no network — the CSP above allows
      only the sibling icon.png. Colors mirror src/renderer/src/styles/tokens.css
      (dark theme only; the splash never sees the user's theme preference).
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #0e0f13;
        color: #edeef3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI',
          system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* lifts the centered column clear of the version line at the bottom */
        padding-bottom: 20px;
        user-select: none;
        cursor: default;
      }

      /* A soft indigo pool behind the mark so the dark icon has a ground to sit
         on rather than dissolving into the #0E0F13 canvas. It has to be a pool
         and not a wide wash: the icon tile's own gradient ENDS on #0E0F13 —
         byte-identical to this background — so without a local lift the
         bottom-right of the squircle has no boundary at all. Centred on the
         mark (150 - 89 = 61px above the window centre, hence the -61 - 230/2
         top margin), and kept tight enough that the lift is under the tile
         instead of spread across the window. */
      .glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 230px;
        height: 230px;
        margin: -176px 0 0 -115px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(123, 128, 255, 0.3) 0%,
          rgba(123, 128, 255, 0.16) 45%,
          rgba(123, 128, 255, 0) 72%
        );
        pointer-events: none;
      }

      /* The mark IS the app icon (resources/icon.png): the PNG carries its own
         squircle silhouette and a transparent margin around it, so the depth
         has to follow the artwork's alpha. A box-shadow would trace the <img>
         box instead — a rounded rectangle floating a dozen pixels outside the
         tile, hairline included.
         140px, not 128: the artwork reserves the macOS HIG margin (the tile is
         824/1024 = 0.81 of the canvas, where the pre-1.6 drawing was 0.88), so
         140 x 0.81 puts the visible tile back at ~113px.
         The first drop-shadow is a hairline light rim. It replaces the
         `inset 0 0 0 1px rgba(255,255,255,0.06)` the old box-shadow drew, and
         it has to be a drop-shadow because only that follows the PNG's alpha;
         without it the tile's dark wash and this canvas are the same colour
         and the silhouette has no edge to read. */
      .mark {
        position: relative;
        width: 140px;
        height: 140px;
        display: block;
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.35))
          drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55))
          drop-shadow(0 0 18px rgba(123, 128, 255, 0.22));
      }

      .wordmark {
        position: relative;
        margin-top: 20px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }

      .tagline {
        position: relative;
        margin-top: 6px;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.03em;
        color: #6e7383;
      }

      .dots {
        position: relative;
        margin-top: 22px;
        display: flex;
        gap: 7px;
      }

      .dots i {
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7b80ff;
        opacity: 0.3;
        animation: pulse 1200ms ease-in-out infinite;
      }

      .dots i:nth-child(2) {
        animation-delay: 160ms;
      }

      .dots i:nth-child(3) {
        animation-delay: 320ms;
      }

      @keyframes pulse {
        0%,
        70%,
        100% {
          opacity: 0.26;
          transform: scale(0.82);
        }
        35% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Version, written by the main process after did-finish-load. Stays an
         empty, invisible row until then so nothing shifts when it fills in. */
      #v {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.06em;
        color: #565b6b;
      }

      @media (prefers-reduced-motion: reduce) {
        .dots i {
          animation: none;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <img class="mark" src="icon.png" alt="" width="140" height="140" />
    <div class="wordmark">Chat</div>
    <div class="tagline">Encrypted team chat</div>
    <div class="dots" role="presentation"><i></i><i></i><i></i></div>
    <div id="v"></div>
  </body>
</html>
